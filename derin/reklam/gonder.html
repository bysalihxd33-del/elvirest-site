<!doctype html><meta charset="utf-8"><title>gonder</title><body>gonderiliyor
<script>
(async()=>{const ad=['k1_feed','k2_feed','k3_feed','k4_feed','k1_story','k4_story'];const out={};
for(const a of ad){const b=await (await fetch(a+'.jpg',{cache:'no-store'})).arrayBuffer();out[a]=b;}
const hedef=window.opener||(window.parent!==window?window.parent:null);if(hedef){hedef.postMessage({derinReklam:out},'https://adsmanager.facebook.com');document.body.textContent='gonderildi';setTimeout(()=>window.close(),1500);}})();
</script>
